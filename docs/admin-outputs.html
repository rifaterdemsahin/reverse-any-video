<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Outputs</title>
<style>
:root { --bg: #f7f6f2; --fg: #1d1d1b; --muted: #5d5b55; --rule: #dcd9cf; --card: #fff; --accent: #0f6e5c;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; --mono: ui-monospace, Menlo, Consolas, monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121412; --fg: #ecebe6; --muted: #aeaca3; --rule: #2e332f; --card: #1a1d1b; --accent: #5fd0b5; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #121412; --fg: #ecebe6; --muted: #aeaca3; --rule: #2e332f; --card: #1a1d1b; --accent: #5fd0b5; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px; }
main { max-width: 1000px; margin: 0 auto; }
h1 { font-size: clamp(1.6rem, 5vw, 2.1rem); margin: 0 0 .3rem; }
.muted { color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; margin: 12px 0; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
td.mono { font-family: var(--mono); font-size: .85rem; }
.files a { display: inline-block; margin: 2px 6px 2px 0; font-size: .85rem; color: var(--accent); }
.msg { min-height: 1.4em; }
.err { color: #b3261e; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body data-area="admin">
<main>
  <div id="site-menu"></div>

  <h1>📦 Outputs</h1>
  <p class="muted">Every finished job, with the account that requested it. Each job's files are kept in its own folder in Azure: <code>outputs/&lt;job&gt;/</code>. Open a file to download it.</p>

  <p class="msg" id="msg" role="status"></p>
  <div class="card">
    <table aria-label="Jobs">
      <thead><tr><th>When</th><th>Job</th><th>Title</th><th>Source</th><th>Requested by</th><th>Files</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  async function load() {
    const r = await fetch("/admin/api/outputs", { cache: "no-store", credentials: "same-origin" });
    if (r.status === 401) { location.href = "/admin/login"; return; }
    const j = await r.json();
    if (!r.ok) { $("msg").className = "msg err"; $("msg").textContent = j.error || "Could not load the outputs."; return; }
    if (!j.jobs.length) { $("msg").textContent = "No jobs yet. Run an analysis from the analyzer."; }
    $("rows").innerHTML = j.jobs.map((x) => `
      <tr>
        <td>${esc(x.created ? new Date(x.created * 1000).toLocaleString() : "")}</td>
        <td class="mono">${esc(x.job_id)}</td>
        <td>${esc(x.title || "untitled")}</td>
        <td>${esc(x.source || "")}</td>
        <td>${esc(x.requested_by || "")}</td>
        <td class="files">${(x.files || []).map((f) =>
          `<a href="/admin/api/outputs/${esc(x.job_id)}/${esc(f)}" download>${esc(f)}</a>`).join("")}</td>
      </tr>`).join("");
  }
  load().catch(() => { $("msg").className = "msg err"; $("msg").textContent = "Could not load the outputs."; });
</script>
<script src="/menu.js" defer></script>
</body>
</html>
