<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Sanity check</title>
<style>
:root { --bg: #f7f6f2; --fg: #1d1d1b; --muted: #5d5b55; --rule: #dcd9cf; --card: #fff; --accent: #0f6e5c; --bad: #b3261e; --good: #137333; --code-bg: #1e2321; --code-fg: #e9f1ee;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; --mono: ui-monospace, Menlo, Consolas, monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121412; --fg: #ecebe6; --muted: #aeaca3; --rule: #2e332f; --card: #1a1d1b; --accent: #5fd0b5; --bad: #f28b82; --good: #81c995; --code-bg: #0b0d0c; --code-fg: #d7e6e0; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #121412; --fg: #ecebe6; --muted: #aeaca3; --rule: #2e332f; --card: #1a1d1b; --accent: #5fd0b5; --bad: #f28b82; --good: #81c995; --code-bg: #0b0d0c; --code-fg: #d7e6e0; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px; }
main { max-width: 820px; margin: 0 auto; }
h1 { font-size: clamp(1.6rem, 5vw, 2.1rem); margin: 0 0 .3rem; }
.muted { color: var(--muted); }
.summary { font-size: 1.1rem; margin: 14px 0; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--rule); background: var(--card); }
.summary.ok { border-color: var(--good); color: var(--good); }
.summary.bad { border-color: var(--bad); color: var(--bad); }
.check { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
.check .head { display: flex; gap: 10px; align-items: baseline; }
.check .mark { font-size: 1.1rem; width: 1.6em; flex: none; }
.check .name { font-weight: 600; }
.check .detail { color: var(--muted); font-size: .92rem; margin-left: 1.6em; }
.check .fix { margin: 8px 0 0 1.6em; font: 13px/1.5 var(--mono); background: var(--code-bg); color: var(--code-fg); padding: 8px 10px; border-radius: 6px; overflow-x: auto; white-space: pre; }
button { font: inherit; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; margin: 8px 0; }
button:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body data-area="admin">
<main>
  <div id="site-menu"></div>

  <h1>🩺 Sanity check</h1>
  <p class="muted">Each check runs against the live server. Green means the piece works. Red shows the one-line fix. Nothing here changes data.</p>

  <button id="run" type="button">Run the checks again</button>
  <div id="summary" class="summary" role="status" aria-live="polite">Running the checks…</div>
  <div id="checks" aria-label="Checks"></div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  async function run() {
    $("run").disabled = true;
    $("summary").className = "summary"; $("summary").textContent = "Running the checks…";
    try {
      const r = await fetch("/admin/api/sanity", { cache: "no-store", credentials: "same-origin" });
      if (r.status === 401) { location.href = "/admin/login"; return; }
      const j = await r.json();
      const passed = j.checks.filter((c) => c.ok).length;
      $("summary").className = "summary " + (j.ok ? "ok" : "bad");
      $("summary").textContent = j.ok
        ? `All ${j.checks.length} checks pass.`
        : `${passed} of ${j.checks.length} checks pass. Fix the red ones, then run again.`;
      $("checks").innerHTML = j.checks.map((c) => `
        <div class="check">
          <div class="head"><span class="mark" aria-hidden="true">${c.ok ? "✅" : "❌"}</span>
            <span class="name">${esc(c.name)}</span>
            <span class="muted" style="margin-left:auto;font-size:.9rem">${c.ok ? "pass" : "fail"}</span></div>
          <div class="detail">${esc(c.detail)}</div>
          ${c.ok ? "" : `<div class="fix">${esc(c.fix)}</div>`}
        </div>`).join("");
    } catch (e) {
      $("summary").className = "summary bad";
      $("summary").textContent = "The checks could not run: " + e.message;
    } finally {
      $("run").disabled = false;
    }
  }
  $("run").addEventListener("click", run);
  run();
</script>
<script src="/menu.js" defer></script>
</body>
</html>
